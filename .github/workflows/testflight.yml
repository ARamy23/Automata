name: Distribute to TestFlight

on:
  push:
    branches:
      - elgendy/m03-10-versioning
  workflow_dispatch:
    inputs:
      name:
        type: choice
        description: Environment
        options: 
        - ALPHA
        - BETA

jobs:
  distribute:
    runs-on: macos-13
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

# MARK: - Setup Environment
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.2'
          bundler-cache: true
      - name: Setup Homebrew Dependencies
        run: |
          brew bundle
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          version: 2024.8.15
          install: false
          cache: true
      - name: Set up environment variables
        run: |
          echo "${{ secrets.FASTLANE_ENV_AUTH_FILE }}" > fastlane/configs/default/.env.default.auth
          echo "${{ secrets.ARKANA_ENV_AUTH_FILE }}" > .env
      - name: Test Configuration
        run: |
          echo "IT'S ALIIIIVE!"

      - name: Generate Project
        run: |
          bundle exec fastlane generate_project
          tuist generate
      - name: Upload to Testflight
        run: |
          bundle exec fastlane distribute_to_testflight env:ALPHA